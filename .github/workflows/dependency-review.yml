name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Fail on newly introduced vulnerabilities at moderate severity or
          # above. This package has zero runtime dependencies, so anything
          # flagged here affects the toolchain or the release pipeline.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with this MIT package.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later
