name: Integration

on:
  # Runs on every pull request rather than a filtered set of paths: this is a
  # required status check, and a required check that never starts leaves the
  # pull request permanently pending. The job takes under a minute.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream changes in cnosdb/cnosdb:community-latest.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # Every listed version is required rather than informational. The pinned
    # tags are immutable, so they cannot break on their own, and an
    # informational failure nobody must act on is one nobody reads.
    name: Integration tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One version failing should not hide the result for the others, which
      # is the whole point of testing a matrix.
      fail-fast: false
      matrix:
        image:
          # Moving tag: the early warning for upstream changes.
          - community-latest
          # Newest pinned patch, so a green run is reproducible.
          - community-2.4.3.4
          # Oldest supported server. 2.4.0 is deliberately absent: it mangles
          # Line Protocol string escapes and drops gzip connections. See
          # docs/compatibility.md.
          - community-2.4.1
    env:
      CNOSDB_IMAGE: cnosdb/cnosdb:${{ matrix.image }}
      CNOSDB_URL: http://127.0.0.1:8902
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start CnosDB
        run: |
          docker run -d --name cnosdb-ci -p 8902:8902 "$CNOSDB_IMAGE"
          docker image inspect "$CNOSDB_IMAGE" \
            --format 'Image digest: {{index .RepoDigests 0}}'

      - name: Wait for CnosDB to become healthy
        run: node scripts/wait-for-cnosdb.mjs "$CNOSDB_URL" 120000

      - name: Run integration tests
        run: npm run test:integration

      - name: Container logs on failure
        if: failure()
        run: docker logs cnosdb-ci --tail 200

      - name: Stop and remove CnosDB
        if: always()
        run: docker rm -f cnosdb-ci || true
