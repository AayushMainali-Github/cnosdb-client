# npm trusted publishing matches on this workflow's filename. Do not rename
# this file after configuring the trusted publisher in the npm package
# settings, or publishing will fail until npm is updated to match.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create tags and releases
      pull-requests: write # open and update the release PR
      id-token: write # npm trusted publishing via OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # changesets/action pushes the release branch with plain git, which
          # uses the credential actions/checkout persists here rather than the
          # token in the step's env. Left as the default GITHUB_TOKEN, the push
          # is attributed to github-actions[bot], and GitHub holds the release
          # PR's workflow runs in action_required, so the required checks on
          # main can never pass. See docs/release-process.md.
          token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      # Use the newest Node 22, not the package's minimum supported version:
      # current npm releases require a recent 22.x patch, and the engine floor
      # in package.json is a requirement for consumers, not for this runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Trusted publishing requires npm 11.5.1 or newer.
      - name: Use an npm version that supports trusted publishing
        run: |
          npm install --global npm@latest
          npm --version

      - run: npm ci

      - name: Verify the release candidate
        run: npm run check

      # Keeps release commits attributed to a real account rather than
      # github-actions[bot]. The noreply address avoids publishing a private
      # one. Authorship alone does not decide whether the release PR's checks
      # run; the push credential configured in the checkout step above does.
      - name: Attribute release commits to the maintainer
        run: |
          git config user.name "AayushMainali-Github"
          git config user.email "94561475+AayushMainali-Github@users.noreply.github.com"

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset publish
          title: "chore(release): version cnosdb-client"
          commit: "chore(release): version cnosdb-client"
          setupGitUser: false
        env:
          # GitHub does not dispatch workflow events for activity performed with
          # GITHUB_TOKEN, so a release PR opened with it starts no checks and can
          # never satisfy the required checks on main. CHANGESETS_GITHUB_TOKEN is
          # a fine-grained PAT or GitHub App token that does trigger them. The
          # fallback keeps this workflow usable before the secret exists, at the
          # cost of a release PR that cannot merge. See docs/release-process.md.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
