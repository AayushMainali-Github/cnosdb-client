# Categories for GitHub's automatically generated release notes.
# The authoritative changelog is CHANGELOG.md, generated by Changesets;
# this only organizes the notes GitHub renders alongside a release.
changelog:
  exclude:
    labels:
      - "no-changeset"
      - "type: maintenance"
  categories:
    - title: Breaking changes
      labels:
        - "breaking change"
    - title: Security
      labels:
        - "type: security"
    - title: Features
      labels:
        - "type: feature"
    - title: Bug fixes
      labels:
        - "type: bug"
    - title: Documentation
      labels:
        - "type: documentation"
    - title: Dependencies
      labels:
        - "dependencies"
    - title: Other changes
      labels:
        - "*"
